[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
check_tool =
  cppcheck
check_skip_packages = yes
check_flags =
  cppcheck: --enable=warning,style,performance,portability --suppress=noExplicitConstructor
lib_deps =
  adafruit/Adafruit NeoPixel
; Host tests run in the native environment; there is nothing to run on-device.
test_ignore = *

; Host-side unit tests for the pure protocol and layout logic. These need no
; board attached, so they can gate every pull request.
[env:native]
platform = native
test_framework = unity
; Link the filtered src/ units into the test binary.
test_build_src = yes
build_flags =
  -std=gnu++17
  -I include
  -I test/stubs
; Only the units that are free of Arduino and Adafruit_NeoPixel dependencies.
; FrameParser is here deliberately: it is the boundary every hostile byte
; crosses, so its framing and length checks must be reachable by the host tests.
build_src_filter =
  -<*>
  +<MatrixProtocol.cpp>
  +<FrameParser.cpp>
